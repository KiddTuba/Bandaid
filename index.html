            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const concertMidi = midiPitch + transpositionOffset;
            const freq = 440 * Math.pow(2, (concertMidi - 69) / 12);

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.type = instrumentType === 'brass' ? 'triangle' : 'sine';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            
            gain.gain.setValueAtTime(0, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.5, audioCtx.currentTime + 0.05);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.5);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + 1.5);
        }

        // --- SVG HELPER ---
        function renderSVGKey(type, x, y, r, w, h, rx, ry, rot, isPressed, label) {
            const fill = isPressed ? '#1e293b' : '#ffffff';
            const stroke = isPressed ? '#0f172a' : '#94a3b8';
            const strokeWidth = 3;
            const textFill = isPressed ? '#ffffff' : '#64748b';
            const transform = rot ? `transform="rotate(${rot} ${x} ${y})"` : '';

            let shape = '';
            if (type === 'circle') {
                shape = `<circle cx="${x}" cy="${y}" r="${r}" fill="${fill}" stroke="${stroke}" stroke-width="${strokeWidth}" ${transform} />`;
            } else if (type === 'rect') {
                shape = `<rect x="${x - w/2}" y="${y - h/2}" width="${w}" height="${h}" rx="6" fill="${fill}" stroke="${stroke}" stroke-width="${strokeWidth}" ${transform} />`;
            } else if (type === 'ellipse') {
                shape = `<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="${fill}" stroke="${stroke}" stroke-width="${strokeWidth}" ${transform} />`;
            }

            let text = '';
            if (label) {
                text = `<text x="${x}" y="${y + 1}" dominant-baseline="middle" text-anchor="middle" fill="${textFill}" font-size="${type === 'circle' ? '12' : '10'}" font-weight="900" ${transform} pointer-events="none" style="user-select: none;">${label}</text>`;
            }

            return `<g>${shape}${text}</g>`;
        }

        // --- RENDERERS ---
        function renderStaff(clef, note, showDetails) {
            const lines = [20, 40, 60, 80, 100];
            const staffY = note ? note.staffY : undefined;
            const acc = note ? note.acc : undefined;

            let ledgerLinesHTML = '';
            if (staffY !== undefined) {
                if (staffY >= 120) {
                    for (let y = 120; y <= staffY; y += 20) {
                        ledgerLinesHTML += `<line x1="85" y1="${y}" x2="125" y2="${y}" stroke="#475569" stroke-width="2" />`;
                    }
                }
                if (staffY <= 0) {
                    for (let y = 0; y >= staffY; y -= 20) {
                        ledgerLinesHTML += `<line x1="85" y1="${y}" x2="125" y2="${y}" stroke="#475569" stroke-width="2" />`;
                    }
                }
            }

            let staffLinesHTML = lines.map(y => `<line x1="20" y1="${y}" x2="180" y2="${y}" stroke="#cbd5e1" stroke-width="2" />`).join('');
            
            let clefHTML = `<text x="30" y="${clef === 'treble' ? 85 : 75}" font-size="${clef === 'treble' ? 80 : 70}" font-family="serif" fill="#64748b">${clef === 'treble' ? '𝄞' : '𝄢'}</text>`;

            let noteHTML = '';
            if (note) {
                let accHTML = acc ? `<text x="70" y="${staffY + 6}" font-size="26" font-family="serif" fill="#ef4444" font-weight="bold">${acc}</text>` : '';
                let headHTML = `<ellipse cx="105" cy="${staffY}" rx="8" ry="6" fill="#1e293b" transform="rotate(-15 105 ${staffY})" />`;
                let stemHTML = staffY >= 60 
                    ? `<line x1="112" y1="${staffY}" x2="112" y2="${staffY - 35}" stroke="#1e293b" stroke-width="2" />`
                    : `<line x1="98" y1="${staffY}" x2="98" y2="${staffY + 35}" stroke="#1e293b" stroke-width="2" />`;
                
                noteHTML = `<g>${ledgerLinesHTML}${accHTML}${headHTML}${stemHTML}</g>`;
            }

            let detailsHTML = showDetails && acc ? `<div class="absolute top-2 right-2 flex flex-col items-end"><span class="bg-red-100 text-red-700 text-xs font-bold px-2 py-1 rounded-full animate-pulse">Check Accidental!</span></div>` : '';

            return `
                <div class="relative w-full max-w-sm mx-auto h-72 bg-white rounded-xl shadow-inner border border-slate-200 overflow-hidden flex items-center justify-center py-4">
                    <svg width="100%" height="100%" viewBox="0 -80 200 300" class="overflow-visible">
                        ${staffLinesHTML}
                        ${clefHTML}
                        ${noteHTML}
                    </svg>
                    ${detailsHTML}
                </div>
            `;
        }

                            ${renderSVGKey('rect', 95, 220, 0, 42, 18, 0, 0, 15, isKey('L_C#'), 'C#/G#')}

                            ${renderSVGKey('rect', 95, 380, 0, 36, 20, 0, 0, -15, isKey('R_Ab'), 'Ab/Eb')}
                            ${renderSVGKey('rect', 95, 410, 0, 36, 20, 0, 0, -15, isKey('R_F#'), 'F#/C#')}

            if (instrument === 'Alto Saxophone') {

        // --- ACTIONS ---
        function handleLogin(e) {
            e.preventDefault();
            const name = document.getElementById('userName').value.trim();
            const inst = document.getElementById('userInst').value;
            if(name && inst) {
                const data = { name, instrument: inst };
                localStorage.setItem('bandProUser', JSON.stringify(data));
                appState.user = data;
                appState.noteIndex = 0;
                renderApp();
                playCurrentNote();
            }
        }

        function handleLogout() {
            localStorage.removeItem('bandProUser');
            appState.user = null;
            if(appState.game.timerId) clearInterval(appState.game.timerId);
            renderApp();
        }

        function switchTab(tab) {
            appState.activeTab = tab;
            if(tab === 'learn') playCurrentNote();
            if(appState.game.timerId) clearInterval(appState.game.timerId);
            appState.game.state = 'menu';
            renderApp();
        }

        function nextLearnNote() {
            const list = NOTES[appState.user.instrument];
            appState.noteIndex = (appState.noteIndex < list.length - 1) ? appState.noteIndex + 1 : 0;
            renderApp();
            playCurrentNote();
        }

        function prevLearnNote() {
            const list = NOTES[appState.user.instrument];
            appState.noteIndex = (appState.noteIndex > 0) ? appState.noteIndex - 1 : list.length - 1;
            renderApp();
            playCurrentNote();
        }

        function playCurrentNote() {
            const inst = appState.user.instrument;
            const instData = INSTRUMENT_METADATA[inst];
            const note = appState.activeTab === 'learn' 
                ? NOTES[inst][appState.noteIndex]
                : appState.game.currentNote;
            
            if(note) playTone(note.midi, instData.transposition, instData.type);
        }

        function startGame(time) {
            appState.game.difficulty = time;
            appState.game.score = 0;
            appState.game.streak = 0;
            nextGameCard();
        }

        function nextGameCard() {
            const list = NOTES[appState.user.instrument];
            appState.game.currentNote = list[Math.floor(Math.random() * list.length)];
            appState.game.timeLeft = appState.game.difficulty;
            appState.game.state = 'playing';
            
            if(appState.game.timerId) clearInterval(appState.game.timerId);
            appState.game.timerId = setInterval(() => {
                appState.game.timeLeft--;
                if(appState.game.timeLeft <= 0) {
                    clearInterval(appState.game.timerId);
                    appState.game.state = 'feedback';
                }
                renderApp();
            }, 1000);

            renderApp();
            playCurrentNote();
        }

        function flipGameCard() {
            if(appState.game.state === 'playing') {
                clearInterval(appState.game.timerId);
                appState.game.state = 'feedback';
                renderApp();
            }
        }

        function gameResult(correct) {
            if(correct) {
                appState.game.score++;
                appState.game.streak++;
            } else {
                appState.game.streak = 0;
            }
            nextGameCard();
        }

        function quitGame() {
            if(appState.game.timerId) clearInterval(appState.game.timerId);
            appState.game.state = 'menu';
            renderApp();
        }

            } else if (appState.activeTab === 'game') {
                if(appState.game.state === 'menu') {
                    mainContent = `
                        <div class="max-w-md mx-auto bg-white p-8 rounded-3xl shadow-sm border border-slate-200 text-center">
                            <div class="w-16 h-16 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center text-3xl mx-auto mb-4">🎮</div>
                            <h2 class="text-2xl font-extrabold text-slate-800 mb-2">Fingering Flashcards</h2>
                            <p class="text-slate-500 font-medium mb-8">Test your accuracy and speed. Identify the note name, accidental, and correct fingering.</p>
                            <div class="space-y-4">
                                <button onclick="startGame(10)" class="w-full py-4 bg-green-500 hover:bg-green-600 text-white font-bold rounded-xl text-lg shadow-md transition-transform active:scale-95">Easy Mode (10s)</button>
                                <button onclick="startGame(3)" class="w-full py-4 bg-red-500 hover:bg-red-600 text-white font-bold rounded-xl text-lg shadow-md transition-transform active:scale-95">Hard Mode (3s)</button>
                            </div>
                        </div>
                    `;
                } else {
                    const note = appState.game.currentNote;
                    const pct = (appState.game.timeLeft / appState.game.difficulty) * 100;
                    const barColor = appState.game.timeLeft <= 3 ? 'bg-red-500' : 'bg-green-500';

                    let cardContent = '';
                    if(appState.game.state === 'playing') {
                        cardContent = `
                            <div class="w-full flex justify-center py-8">
                                ${renderStaff(instData.clef, note, false)}
                            </div>
                            <div class="w-full mt-4">
                                <button onclick="flipGameCard()" class="w-full py-4 bg-slate-800 hover:bg-slate-900 text-white font-bold rounded-xl text-xl shadow-md transition-transform active:scale-95">Flip Card</button>
                            </div>
                        `;
                    } else {
                        cardContent = `
                            <h3 class="text-5xl font-black text-slate-800 mt-4 mb-2">${note.name}</h3>
                            ${note.enharmonic ? `<p class="text-md font-bold text-slate-500 mb-4">(or ${note.enharmonic})</p>` : ''}
                            <div class="w-full bg-slate-50 rounded-2xl p-4 my-4">
                                ${renderFingeringChart(appState.user.instrument, note.fingering, instData.type === 'brass')}
                            </div>
                            ${instData.type === 'brass' && note.slot ? `
                                <div class="text-lg font-black text-blue-600 mb-6 uppercase tracking-wider">Slot ${note.slot}</div>
                            ` : ''}
                            <div class="w-full grid grid-cols-2 gap-4 mt-2">
                                <button onclick="gameResult(false)" class="py-3 bg-red-100 hover:bg-red-200 text-red-700 font-bold rounded-xl text-lg transition-colors">Got it wrong</button>
                                <button onclick="gameResult(true)" class="py-3 bg-green-100 hover:bg-green-200 text-green-700 font-bold rounded-xl text-lg transition-colors">Got it right!</button>
                            </div>
                        `;
                    }

                    mainContent = `
                        <div class="max-w-lg mx-auto">
                            <div class="flex justify-between items-center mb-6 px-2">
                                <button onclick="quitGame()" class="text-sm font-bold text-slate-400 hover:text-slate-600">Quit</button>
                                <div class="flex gap-4">
                                    <div class="bg-blue-100 text-blue-800 px-3 py-1 rounded-lg font-black text-sm">Score: ${appState.game.score}</div>
                                    <div class="bg-orange-100 text-orange-800 px-3 py-1 rounded-lg font-black text-sm">Streak: 🔥 ${appState.game.streak}</div>
                                </div>
                            </div>
                            <div class="bg-white rounded-3xl shadow-lg border-2 border-slate-100 p-6 flex flex-col items-center relative overflow-hidden transition-all duration-300 transform perspective-1000">
                                <div class="absolute top-0 left-0 h-1.5 bg-slate-100 w-full">
                                    <div class="h-full transition-all duration-1000 linear ${barColor}" style="width: ${pct}%"></div>
                                </div>
                                ${cardContent}
                            </div>
                        </div>
                    `;
                }
            }

            root.innerHTML = `
                ${headerHTML}
                ${tabsHTML}
                <main class="max-w-4xl mx-auto p-4 mt-4 pb-20">
                    ${mainContent}
                </main>
            `;
        }

        // Initialize App
        renderApp();
        if(appState.user && appState.activeTab === 'learn') {
            setTimeout(playCurrentNote, 500); // slight delay on mount
        }

    </script>
</body>
</html>
